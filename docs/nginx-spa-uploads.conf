# Example nginx site config for SPA + media uploads.
# Key rule: keep /uploads/ before the SPA fallback block.

server {
    listen 80;
    server_name your-domain.example;

    # Frontend build output directory (adjust to your path).
    root /var/www/SchemeWD/WSchemeAPI/dist;
    index index.html;

    # Serve uploaded files directly from backend/public/uploads.
    # This must be above the "/" fallback so media URLs never hit index.html.
    #
    # If you are unsure about the on-disk path/permissions, you can use
    # the proxy variant below instead (more robust, but slightly slower).
    location /uploads/ {
        # Option A (static alias - fastest):
        alias /var/www/SchemeWD/WSchemeAPI/public/uploads/;
        # When using alias, $request_filename maps the request to the real file path.
        try_files $request_filename =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Option B (proxy to node/express static):
        # proxy_pass http://localhost:3000/uploads/;
        # proxy_set_header Host $host;
    }

    # SPA fallback for client-side routes only.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional API proxy (if frontend and API share this domain).
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
